[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-liquidity"
version = "0.1.0"
description = "XAUUSD liquidity sweep backtester using MetaTrader 5"
requires-python = ">=3.10"
dependencies = [
    "MetaTrader5>=5.0.6231",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
